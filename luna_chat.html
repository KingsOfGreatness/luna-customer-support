<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Customer Support AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 600px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            background: linear-gradient(135deg, #e91e63 0%, #ad1457 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .luna-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b9d, #ffd93d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
            overflow: hidden;
        }

        .luna-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .luna-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .luna-status {
            font-size: 12px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            scrollbar-width: thin;
            scrollbar-color: #e91e63 transparent;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #e91e63;
            border-radius: 2px;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.luna {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.luna .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e1e5e9;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.system .message-bubble {
            background: #f0f2f5;
            color: #65676b;
            font-size: 12px;
            text-align: center;
            border-radius: 12px;
            margin: 0 auto;
            max-width: 60%;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            max-width: 80%;
            border: 1px solid #e1e5e9;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e91e63;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingAnimation {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            animation: slideIn 0.3s ease-out 0.2s both;
        }

        .quick-reply-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .quick-reply-btn:hover {
            background: white;
            color: #e91e63;
            border-color: #e91e63;
            transform: translateY(-1px);
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8f9fa;
            border-radius: 24px;
            padding: 8px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #e91e63;
        }

        .message-input {
            flex: 1;
            border: none;
            background: none;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            resize: none;
            max-height: 80px;
            min-height: 20px;
        }

        .voice-btn, .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .voice-btn {
            background: #f0f2f5;
            color: #65676b;
        }

        .voice-btn:hover, .voice-btn.recording {
            background: #e91e63;
            color: white;
            transform: scale(1.1);
        }

        .send-btn {
            background: #e91e63;
            color: white;
        }

        .send-btn:hover {
            background: #ad1457;
            transform: scale(1.1);
        }

        .send-btn:disabled {
            background: #f0f2f5;
            color: #65676b;
            cursor: not-allowed;
            transform: none;
        }

        .connection-status {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }

        .connection-status.show {
            opacity: 1;
            top: -50px;
        }

        .connection-status.connected {
            background: #4caf50;
        }

        .connection-status.error {
            background: #f44336;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            
            .chat-container {
                height: 100vh;
                max-width: none;
                border-radius: 0;
            }
        }

        .luna-greeting {
            background: linear-gradient(135deg, #e91e63 0%, #ad1457 100%);
            color: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .greeting-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .greeting-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }
    </style>
</head>

            </div>
            <div class="luna-info">
                <h3>Luna</h3>
                <div class="luna-status">
                    <div class="status-dot"></div>
                    <span id="statusText">online 24/7</span>
                </div>
            </div>
            <button class="close-btn" onclick="closeChat()">&times;</button>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="luna-greeting">
                <div class="greeting-title">Zdravo, kako vam mogu pomoći? 👋</div>
                <div class="greeting-subtitle">***</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecording()" title="Voice message">
                    🎤
                </button>
                <textarea 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Imaš upit..." 
                    rows="1"
                    onkeydown="handleKeyPress(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled title="Send message">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let clientId = 'luna-client-' + Math.random().toString(36).substr(2, 9);
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isTyping = false;

        // Initialize chat
        document.addEventListener('DOMContentLoaded', function() {
            connectToLuna();
            updateSendButton();
        });

        function connectToLuna() {
            showConnectionStatus('Connecting to Luna...', 'connecting');
            
            ws = new WebSocket(`ws://localhost:8000/api/v1/ws/${clientId}`);
            
            ws.onopen = () => {
                showConnectionStatus('Connected to Luna ✓', 'connected');
                setTimeout(hideConnectionStatus, 2000);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleLunaMessage(data);
            };
            
            ws.onclose = () => {
                showConnectionStatus('Disconnected from Luna', 'error');
                setTimeout(() => {
                    showConnectionStatus('Reconnecting...', 'connecting');
                    setTimeout(connectToLuna, 2000);
                }, 1000);
            };
            
            ws.onerror = (error) => {
                showConnectionStatus('Connection error', 'error');
            };
        }

        function handleLunaMessage(data) {
            switch(data.type) {
                case 'connection':
                    addSystemMessage('Connected to Luna');
                    break;
                    
                case 'message_response':
                    removeTypingIndicator();
                    addLunaMessage(data.response);
                    
                    // Show detected language for transparency
                    if (data.language) {
                        addSystemMessage(`Language: ${data.language}`);
                    }
                    
                    // Auto-play Luna's voice response if available
                    playLunaVoice(data.response, data.language);
                    
                    if (data.suggested_actions && data.suggested_actions.length > 0) {
                        addQuickReplies(data.suggested_actions);
                    }
                    break;
                    
                case 'typing':
                    if (data.is_typing) {
                        showTypingIndicator();
                    } else {
                        removeTypingIndicator();
                    }
                    break;
                    
                case 'error':
                    removeTypingIndicator();
                    addSystemMessage('Luna: ' + data.error);
                    break;
                    
                case 'pong':
                    addSystemMessage('Connection test successful');
                    break;
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            addUserMessage(message);
            
            // Send message WITHOUT specifying language - let AI detect it
            ws.send(JSON.stringify({
                type: 'text',
                message: message,
                // Remove hardcoded language - let the AI detect it
                company_id: 1
            }));
            
            input.value = '';
            autoResize(input);
            updateSendButton();
        }

        function addUserMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(message)}</div>`;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addLunaMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message luna';
            messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(message)}</div>`;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addSystemMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(message)}</div>`;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            if (isTyping) return;
            isTyping = true;
            
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message luna';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <span style="font-size: 12px; color: #65676b;">Luna is typing</span>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
            isTyping = false;
        }

        function addQuickReplies(actions) {
            const container = document.getElementById('messagesContainer');
            const repliesDiv = document.createElement('div');
            repliesDiv.className = 'quick-replies';
            
            actions.forEach(action => {
                const button = document.createElement('button');
                button.className = 'quick-reply-btn';
                button.textContent = action;
                button.onclick = () => useQuickReply(action);
                repliesDiv.appendChild(button);
            });
            
            container.appendChild(repliesDiv);
            scrollToBottom();
        }

        function useQuickReply(action) {
            document.getElementById('messageInput').value = action;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
            updateSendButton();
        }

        function updateSendButton() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = !input.value.trim();
        }

        function toggleVoiceRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    sendVoiceMessage(audioBlob);
                };
                
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
                showConnectionStatus('Recording...', 'recording');
                
            } catch (error) {
                showConnectionStatus('Microphone access denied', 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('voiceBtn').classList.remove('recording');
                hideConnectionStatus();
            }
        }

        async function sendVoiceMessage(audioBlob) {
            try {
                showConnectionStatus('Processing voice...', 'processing');
                
                // Create FormData to send audio file
                const formData = new FormData();
                formData.append('audio_file', audioBlob, 'voice_message.wav');
                
                // Send to voice-to-text API
                const response = await fetch('/api/v1/voice-to-text', {
                    method: 'POST',
                    headers: {
                        'api-key': 'test-key-123'
                    },
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.transcribed_text) {
                    // Add the transcribed text as user message
                    addUserMessage(`🎤 ${result.transcribed_text}`);
                    
                    // Send the transcribed text to Luna via WebSocket
                    ws.send(JSON.stringify({
                        type: 'text',
                        message: result.transcribed_text,
                        company_id: 1
                    }));
                    
                    hideConnectionStatus();
                } else {
                    showConnectionStatus('Could not understand audio', 'error');
                    setTimeout(hideConnectionStatus, 3000);
                }
                
            } catch (error) {
                console.error('Voice processing error:', error);
                showConnectionStatus('Voice processing failed', 'error');
                setTimeout(hideConnectionStatus, 3000);
            }
        }

        function showConnectionStatus(message, type) {
            const status = document.getElementById('connectionStatus');
            status.textContent = message;
            status.className = `connection-status show ${type}`;
        }

        function hideConnectionStatus() {
            const status = document.getElementById('connectionStatus');
            status.classList.remove('show');
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function playLunaVoice(text, language) {
            try {
                // Only play voice for short responses to avoid long audio
                if (text.length > 200) return;
                
                const response = await fetch('/api/v1/text-to-voice', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'api-key': 'test-key-123'
                    },
                    body: JSON.stringify({
                        text: text,
                        language: language || 'english'
                    })
                });
                
                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    
                    // Add voice indicator
                    const voiceIndicator = document.createElement('span');
                    voiceIndicator.innerHTML = ' 🔊';
                    voiceIndicator.style.opacity = '0.7';
                    voiceIndicator.style.fontSize = '12px';
                    
                    const lastMessage = document.querySelector('.message.luna:last-child .message-bubble');
                    if (lastMessage) {
                        lastMessage.appendChild(voiceIndicator);
                    }
                    
                    audio.play().catch(e => {
                        console.log('Audio autoplay prevented:', e);
                        // Autoplay might be blocked, that's ok
                    });
                    
                    // Clean up
                    audio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                    };
                }
            } catch (error) {
                console.log('Voice playback error:', error);
                // Fail silently for voice features
            }
        }

        function closeChat() {
            if (confirm('Are you sure you want to close the chat?')) {
                if (ws) ws.close();
                window.close();
            }
        }
        // Initialize input listeners
        document.getElementById('messageInput').addEventListener('input', updateSendButton);
    </script>
</body>
</html>
